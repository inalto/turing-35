[workspace]
resolver = "2"
members = ["crates/turing-proto", "crates/turing-device", "crates/turing-canvas", "crates/turing-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/inalto/turzx"

[workspace.dependencies]
turing-proto = { path = "crates/turing-proto" }
serialport = "4.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
thiserror = "2"
fontdue = "0.9"
turing-device = { path = "crates/turing-device" }
turing-canvas = { path = "crates/turing-canvas" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
